name: Build MonoPoly for MPC

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out the MPC SDK
        uses: actions/checkout@v4
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          ref: main
          path: sdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy plugin into SDK
        shell: bash
        run: |
          mkdir -p sdk/plugins/MonoPoly
          cp plugins/MonoPoly/plugin.json sdk/plugins/MonoPoly/
          cp -R plugins/MonoPoly/src sdk/plugins/MonoPoly/
          cp plugins/MonoPoly/ui.json sdk/plugins/MonoPoly/

      - name: Build and validate
        run: python3 sdk/tools/build.py sdk/plugins/MonoPoly

      - name: Upload the MPC plugin
        uses: actions/upload-artifact@v4
        with:
          name: HolyPoly-for-MPC
          path: sdk/plugins/MonoPoly/build/HolyPoly - VST - HolyPoly
